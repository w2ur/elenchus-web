<!-- Elenchus favicon — the Untilt house contour, tinted teal.

     Replaces the Astro starter's rocket logo, which shipped untouched from
     `npm create astro` until v0.2. Same drawing and the same #0F1117 rounded
     rect as ~/Dev/untilt/client/public/favicon.svg and
     ~/Dev/elenchus/icons/icon.svg; only the stroke ramp differs — teal for
     Elenchus, house blue-grey for Untilt and Doxa. The trade is stated rather
     than hidden: at 16px three same-shape icons separated only by hue are
     weakly discriminable. Accepted because they never appear side by side —
     different domains, different surfaces.

     Copied from the extension's icons/icon.svg, which is the variant already
     tuned for small sizes, not from untilt's four-contour favicon. Three
     things differ from that one, each rendered at 16px and looked at rather
     than assumed:

       - TWO contours, not four. The favicon's four are 27-34 user units
         apart, which at 16px (32 units per pixel) is under one pixel of
         separation: they merge into a smudge. The outermost and the innermost
         are 90 units apart — 2.8px at 16px — and stay two distinct rings.
       - Stroke 32, not 6. The favicon's 6 renders 0.19px at 16px and
         vanishes. 32 renders 1px.
       - translate(0,48). The contour sits high in its box (bbox centre y=208
         of 512), which reads as off-centre once the drawing is only 16px wide
         and there is no page around it.

     The rounded rect is dark in BOTH schemes on purpose, exactly as untilt's
     is: it is the house's own register, and a tab icon that inverts with the
     reader's theme stops being recognisable as the same mark. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="108" fill="#0F1117"/>
  <g transform="translate(0,48)" fill="none" stroke-width="32" stroke-linecap="round">
    <path d="M256 420C256 420 96 360 72 220C48 80 168 20 256 8C344 -4 464 56 440 200C416 344 256 420 256 420Z" stroke="#1E7A76"/>
    <path d="M256 245C256 245 198 220 190 175C182 130 212 105 256 98C300 91 330 118 323 165C316 212 256 245 256 245Z" stroke="#5FC2BC"/>
  </g>
</svg>
